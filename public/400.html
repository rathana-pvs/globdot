<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>400 Bad Request — Globdot</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fcfcfc;
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .box {
      max-width: 480px;
      padding: 24px;
    }
    .kicker {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c33a31;
      display: block;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 16px 0;
      letter-spacing: -0.02em;
    }
    p {
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 28px 0;
    }
    a {
      display: inline-block;
      padding: 10px 24px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 500;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <span class="kicker">400 — Bad Request</span>
    <h1>Invalid Request</h1>
    <p>The server could not process your request due to invalid syntax or parameters. Please verify the URL and try again.</p>
    <a href="/">Return to Globdot Home</a>
  </div>
</body>
</html>
