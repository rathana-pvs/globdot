# /etc/nginx/sites-available/globdot
# Globdot Production Nginx Reverse Proxy Configuration

# Rate limiting zone for API and Admin protection
limit_req_zone $binary_remote_addr zone=globdot_limit:10m rate=20r/s;

upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. HTTP Server (Port 80) — Handles ACME challenge & proxies / redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name globdot.com www.globdot.com;

    # Let's Encrypt / Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Pass through to Next.js application
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }
}

