# /etc/nginx/sites-available/globdot
# Globdot Production Nginx Reverse Proxy Configuration

limit_req_zone $binary_remote_addr zone=globdot_limit:10m rate=20r/s;

upstream globdot_upstream {
    server 127.0.0.1:3001;
    keepalive 64;
}

# 1. HTTP Server (Port 80 & Port 8080)
server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name globdot.com www.globdot.com;

    # Disable server version disclosure
    server_tokens off;

    # Let's Encrypt / Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Pass through to Next.js application
    location / {
        proxy_pass http://globdot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    error_page 400 /400.html;
    location = /400.html {
        root /var/www/globdot/public;
        internal;
    }
}

# 2. HTTPS Server (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name globdot.com www.globdot.com;

    ssl_certificate /etc/letsencrypt/live/globdot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globdot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Disable server version disclosure
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: https://images.unsplash.com https://res.cloudinary.com https://globdot.com https://www.globdot.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://*.google-analytics.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Max upload size for Payload CMS media
    client_max_body_size 50M;

    # Cache Next.js immutable static chunks
    location /_next/static/ {
        proxy_pass http://globdot_upstream;
        proxy_set_header Host $host;
        proxy_cache_bypass 1;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve public media uploads directly from disk
    location /media/ {
        alias /var/www/globdot/public/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri $uri/ @next_app;
    }

    location @next_app {
        proxy_pass http://globdot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit API and Admin authentication routes
    location /api/ {
        limit_req zone=globdot_limit burst=30 nodelay;
        proxy_pass http://globdot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_buffering off; # Enable streaming for SSE / AI assist
        proxy_read_timeout 300s;
    }

    # Main application proxy
    location / {
        proxy_pass http://globdot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    error_page 400 /400.html;
    location = /400.html {
        root /var/www/globdot/public;
        internal;
    }
}
